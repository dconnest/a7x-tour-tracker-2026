name: Update A7X Tour Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: a7x-tour-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch setlists and regenerate site
        env:
          SETLIST_FM_API_KEY: ${{ secrets.SETLIST_FM_API_KEY }}
        run: python update_tracker.py

      - name: Commit updates when data changed
        run: |
          if git diff --quiet -- index.html data/tour-data.json; then
            echo "No setlist changes detected."
            exit 0
          fi

          git config user.name "a7x-tracker-bot"
          git config user.email "a7x-tracker-bot@users.noreply.github.com"
          git add index.html data/tour-data.json
          git commit -m "Update A7X tour tracker"
          git push
